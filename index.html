<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1e293b">
<title>Kalender</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--sub:#94a3b8;--accent:#60a5fa}
*{margin:0;padding:0;box-sizing:border-box;font-family:ui-sans-serif,system-ui,-apple-system,sans-serif}
body{background:var(--bg);color:var(--text);line-height:1.6}
header{padding:1rem 1.5rem;display:flex;align-items:center;gap:1rem;border-bottom:1px solid #334155;position:sticky;top:0;background:rgba(15,23,42,.9);backdrop-filter:blur(8px);z-index:10}
header h1{font-size:1.25rem;flex:1}
.profiles{display:flex;gap:.5rem;flex-wrap:wrap}
.profile-btn{padding:.5rem .75rem;border:1px solid #475569;background:transparent;color:var(--text);border-radius:.5rem;cursor:pointer;font-size:.875rem}
.profile-btn.active{background:var(--accent);color:#0f172a;font-weight:600;border-color:transparent}
main{padding:1rem 1.5rem;max-width:1200px;margin:0 auto}
.toolbar{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
.btn{padding:.5rem .75rem;border:1px solid #475569;background:#334155;color:var(--text);border-radius:.5rem;cursor:pointer}
.view-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem}
.card{background:var(--card);border:1px solid #334155;border-radius:.75rem;padding:1rem}
.card h2{font-size:1rem;margin-bottom:.5rem;color:var(--sub)}
.item{padding:.5rem;border:1px solid #334155;border-radius:.5rem;margin-bottom:.5rem}
.item-title{font-weight:600}
.item-time{font-size:.875rem;color:var(--sub)}
.hidden{display:none}
</style>
</head>
<body>
<header>
<h1>Kalender</h1>
<div class="profiles" id="profiles"></div>
</header>
<main>
<div class="toolbar">
<button class="btn" id="new-profile">+ Profil Baru</button>
<button class="btn" id="new-item">+ Tambah Catatan</button>
</div>
<div class="view-grid" id="grid"></div>
</main>
<script src="app.js?v=3"></script>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
</script>
</body>
</html>
