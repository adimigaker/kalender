<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<title>Kalender</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--sub:#94a3b8}
*{margin:0;padding:0;box-sizing:border-box;font-family:ui-sans-serif,system-ui}
body{background:var(--bg);color:var(--text)}
header{padding:1rem;display:flex;align-items:center;gap:.5rem;border-bottom:1px solid #334155;position:sticky;top:0;background:rgba(15,23,42,.9)}
header h1{font-size:1.1rem;flex:1}
.btn{padding:.4rem .6rem;border:1px solid #475569;background:#334155;color:var(--text);border-radius:.5rem}
main{padding:1rem;max-width:900px;margin:0 auto}
#cal{margin-top:1rem}
</style>
</head>
<body>
<header>
<button class="btn" id="prev">←</button>
<h1 id="month"></h1>
<button class="btn" id="next">→</button>
<button class="btn" id="today">Hari ini</button>
</header>
<main>
<div id="cal"></div>
</main>
<script src="app.js?v=7"></script>
</body>
</html>
