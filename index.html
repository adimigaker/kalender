<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalender</title>
<style>
:root{--bg:#0f172a;--card:#162032;--text:#e2e8f0;--sub:#94a3b8;--border:#334155;--blue:#60a5fa;--green:#34d399;--red:#f87171}
body{background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui;margin:0;padding:0}
header{padding:1rem;border-bottom:1px solid var(--border)}
.big{font-size:1.5rem;font-weight:700}
.small{font-size:.8rem;color:var(--sub)}
.dow{display:grid;grid-template-columns:repeat(7,1fr);padding:.5rem 0;font-weight:600;font-size:.7rem;text-align:center}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border:1px solid var(--border)}
.cell{background:var(--card);min-height:80px;position:relative;padding:5px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.g{font-size:1.2rem;font-weight:700}
.h{position:absolute;top:2px;right:4px;font-size:.6rem;color:var(--blue)}
.p{font-size:.6rem;color:var(--sub);margin-top:2px}
.btn{padding:.4rem;background:#334155;color:white;border:none;border-radius:4px}
</style>
</head>
<body>
<header>
<div class="big" id="big"></div>
<div class="small" id="small"></div>
<div style="margin-top:10px">
  <button class="btn" id="prev">←</button>
  <button class="btn" id="today">Hari ini</button>
  <button class="btn" id="next">→</button>
</div>
</header>
<div id="cal"></div>
<script src="app.js?v=15"></script>
</body>
</html>
