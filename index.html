<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<title>Kalender</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--sub:#94a3b8;--border:#334155;--accent:#60a5fa}
*{margin:0;padding:0;box-sizing:border-box;font-family:ui-sans-serif,system-ui}
body{background:var(--bg);color:var(--text)}
header{padding:.75rem 1rem;display:flex;align-items:center;gap:.5rem;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(15,23,42,.95);backdrop-filter:blur(8px);z-index:10}
header h1{font-size:1.05rem;flex:1}
.btn{padding:.4rem .6rem;border:1px solid var(--border);background:#334155;color:var(--text);border-radius:.5rem;font-size:.9rem}
main{padding:1rem;max-width:920px;margin:0 auto}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:.25rem;margin-bottom:.5rem}
.dow>div{font-size:.75rem;color:var(--sub);text-align:center}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:.25rem}
.cell{border:1px solid var(--border);border-radius:.5rem;min-height:90px;padding:.4rem;background:#162032}
.cell.empty{background:transparent;border-color:transparent}
.cell.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.dnum{font-size:.9rem}
</style>
</head>
<body>
<header>
<button class="btn" id="prev">←</button>
<h1 id="month"></h1>
<button class="btn" id="next">→</button>
<button class="btn" id="today">Hari ini</button>
</header>
<main>
<div id="cal"></div>
</main>
<script src="app.js?v=10"></script>
</body>
</html>
