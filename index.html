<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalender</title>
<style>
:root{--bg:#0f172a;--card:#162032;--text:#e2e8f0;--sub:#94a3b8;--border:#334155;--blue:#60a5fa;--green:#34d399;--red:#f87171}
body{background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui;margin:0;padding:12px;display:flex;flex-direction:column;align-items:center}
.container{width:100%;max-width:480px}
header{padding:1rem 0;border-bottom:1px solid var(--border);text-align:left}
.big{font-size:1.5rem;font-weight:700}
.small{font-size:.8rem;color:var(--sub);margin-top:4px}
.nav{margin-top:10px;display:flex;gap:6px}
.btn{padding:.4rem .8rem;background:#334155;color:white;border:none;border-radius:4px;font-weight:600;cursor:pointer}
.dow{display:grid;grid-template-columns:repeat(7,1fr);padding:.5rem 0;font-weight:600;font-size:.75rem;text-align:center}
.d-blue{color:var(--blue)}
.d-green{color:var(--green)}
.d-red{color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border:1px solid var(--border)}
.cell{background:var(--card);min-height:80px;position:relative;padding:5px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cell.empty{background:var(--bg)}
.g{font-size:1.2rem;font-weight:700}
.h{position:absolute;top:3px;right:5px;font-size:.7rem;color:var(--blue);font-family:serif,system-ui}
.p{font-size:.65rem;color:var(--sub);margin-top:2px}
.today{outline:2px solid var(--blue);outline-offset:-2px;z-index:2}
.sunday-cell .g{color:var(--red)}
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="big" id="big">Oktober 2026</div>
    <div class="small" id="small">19 Rabiul Akhir 1448 H - 20 Jumadil Awal 1448 H</div>
    <div class="nav">
      <button class="btn" id="prev">←</button>
      <button class="btn" id="today">Hari ini</button>
      <button class="btn" id="next">→</button>
    </div>
  </header>
  <div id="cal"></div>
</div>
<script src="app.js"></script>
</body>
</html>
